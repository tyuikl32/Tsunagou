[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "tsunagou"
version = "0.1.0"
description = "Local coordination runtime for multiple coding agents"
requires-python = ">=3.13,<3.14"
dependencies = [
  "alembic>=1.16,<2",
  "fastapi>=0.115,<1",
  "jsonschema>=4.23,<5",
  "platformdirs>=4.3,<5",
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.7,<3",
  "rfc8785>=0.1.4,<1",
  "sqlalchemy>=2.0,<3",
  "typer>=0.15,<1",
  "uvicorn>=0.34,<1",
]

[project.optional-dependencies]
dev = [
  "hypothesis>=6.122,<7",
  "mypy>=1.15,<2",
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.25,<1",
  "ruff>=0.9,<1",
]

[project.scripts]
tsunagou = "tsunagou.cli.app:main"

[tool.hatch.build.targets.wheel]
packages = ["src/tsunagou"]

[tool.ruff]
target-version = "py313"
line-length = 140
src = ["src", "tools"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.13"
strict = true
mypy_path = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
